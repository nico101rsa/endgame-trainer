<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    a { color: #c53024; } a:hover { color: #9c2118; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f0e6d2; color: #1a170f; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 52px 22px 12px 22px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a170f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
      <div style="font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px">Review</div>
    </div>
    <div style="font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: 18px">2/6</div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 0 22px 20px 22px">
    <div style="flex-grow: 1; height: 8px; border: 2px solid #1a170f"><div style="width: 33%; height: 100%; background: #1a170f"></div></div>
  </div>

  <div style="display: flex; flex-direction: column; margin: 0 18px; border: 3px solid #1a170f; background: #f7efdd; box-shadow: 7px 7px 0 #1a170f; flex-grow: 1">
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 3px solid #1a170f">
      <div style="width: 12px; height: 12px; background: #c53024"></div>
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase">Principle · King opposition</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 26px 22px; flex-grow: 1">
      <div style="font-size: 21px; font-weight: 800; line-height: 1.3">Kings face each other with one empty square between them. Who has the opposition?</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="width: 46px; height: 5px; background: #c53024"></div>
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #6f6552">Answer</div>
      </div>
      <div style="font-size: 17px; line-height: 1.5; font-weight: 500">The side <span style="font-weight: 800; color: #c53024">not</span> to move. They can hold the face-off; the mover must give way.</div>
    </div>
    <div style="padding: 0 18px 18px 18px">
      <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #6f6552">Next: position on the board</div>
    </div>
  </div>

  <div style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; text-align: center; padding: 22px 22px 12px 22px">How well did you know it?</div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 18px 40px 18px">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; background: #c53024; color: #f0e6d2">
      <div style="font-size: 13px; font-weight: 800; text-transform: uppercase">Again</div>
      <div style="font-size: 10px; font-weight: 700; opacity: 0.85">1d</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; border: 3px solid #1a170f; color: #1a170f">
      <div style="font-size: 13px; font-weight: 800; text-transform: uppercase">Hard</div>
      <div style="font-size: 10px; font-weight: 700; color: #6f6552">4d</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; background: #1a170f; color: #f0e6d2">
      <div style="font-size: 13px; font-weight: 800; text-transform: uppercase">Good</div>
      <div style="font-size: 10px; font-weight: 700; opacity: 0.85">8d</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; border: 3px solid #1a170f; color: #1a170f">
      <div style="font-size: 13px; font-weight: 800; text-transform: uppercase">Easy</div>
      <div style="font-size: 10px; font-weight: 700; color: #6f6552">13d</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
