        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <div style="font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px">Foundations</div>
          <div style="font-size: 11px; font-weight: 700; color: #6f6552">–999</div>
        </div>
        <div style="height: 10px; border: 2px solid #1a170f"><div style="width: 100%; height: 100%; background: #c53024"></div></div>

    <div style="display: flex; align-items: stretch; border: 3px solid #1a170f; background: #f7efdd; box-shadow: 5px 5px 0 #1a170f">

          <div style="font-size: 11px; font-weight: 700; color: #6f6552">1200–1399</div>
        </div>
        <div style="height: 10px; border: 2px solid #1a170f"><div style="width: 20%; height: 100%; background: #c53024"></div></div>

      <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; flex-grow: 1">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
          <div style="font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px">Strong club</div>

        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M12 6.5C10.7 5 8.7 4.2 4.5 4.2v13.6c4.2 0 6.2.8 7.5 2.2 1.3-1.4 3.3-2.2 7.5-2.2V4.2c-4.2 0-6.2.8-7.5 2.3z"></path><path d="M12 6.5V20"></path></svg>
