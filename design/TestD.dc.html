<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #3159c9; } a:hover { color: #24439c; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #fcfcfa; color: #17181a; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 58px 24px 18px 24px">
    <div style="display: flex; align-items: center; gap: 14px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#17181a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
      <div style="font-size: 16px; font-weight: 600">King opposition</div>
    </div>
    <div style="font-size: 14px; color: #9a9c9e">3 / 6</div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 0 24px 20px 24px">
    <div style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; border: 1.5px solid #17181a"></div>
    <div style="font-size: 15px; font-weight: 500">White to play and win</div>
  </div>

  <div style="margin: 0 24px">
    <div style="position: relative; width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#dcdad2 0% 25%, #f4f3ef 0% 50%); background-size: 25% 25%; border-radius: 6px; overflow: hidden; border: 1px solid #e6e6e2">
      <div style="position: absolute; left: 50%; top: 12.5%; width: 12.5%; height: 12.5%; background: rgba(49, 89, 201, 0.14)"></div>
      <div style="position: absolute; left: 50%; top: 25%; width: 12.5%; height: 12.5%; background: rgba(49, 89, 201, 0.24)"></div>
      <div style="position: absolute; left: 50%; top: 25%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 78%; height: 78%"><path d="M18 2h4v5h5v4h-5v3h-4v-3h-5V7h5z" fill="#26272a" stroke="#111214" stroke-width="1.2" stroke-linejoin="round"></path><path d="M11.5 34C9.5 24 14 17.5 20 15.5c6 2 10.5 8.5 8.5 18.5z" fill="#26272a" stroke="#111214" stroke-width="1.2" stroke-linejoin="round"></path><rect x="8.5" y="33" width="23" height="4.5" rx="2" fill="#26272a" stroke="#111214" stroke-width="1.2"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 78%; height: 78%"><path d="M18 2h4v5h5v4h-5v3h-4v-3h-5V7h5z" fill="#ffffff" stroke="#3b3c40" stroke-width="1.2" stroke-linejoin="round"></path><path d="M11.5 34C9.5 24 14 17.5 20 15.5c6 2 10.5 8.5 8.5 18.5z" fill="#ffffff" stroke="#3b3c40" stroke-width="1.2" stroke-linejoin="round"></path><rect x="8.5" y="33" width="23" height="4.5" rx="2" fill="#ffffff" stroke="#3b3c40" stroke-width="1.2"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 62.5%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 64%; height: 64%"><circle cx="20" cy="11" r="6" fill="#ffffff" stroke="#3b3c40" stroke-width="1.2"></circle><path d="M13.5 33c0-8 3.5-12.5 6.5-14.5 3 2 6.5 6.5 6.5 14.5z" fill="#ffffff" stroke="#3b3c40" stroke-width="1.2" stroke-linejoin="round"></path><rect x="10.5" y="32.5" width="19" height="4.5" rx="2" fill="#ffffff" stroke="#3b3c40" stroke-width="1.2"></rect></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 26px 24px 0 24px; flex-grow: 1">
    <div style="font-size: 15px; line-height: 1.55; color: #55575a">Use the opposition to escort the pawn. Black just stepped to e6 — answer with your king, not the pawn.</div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex-grow: 1; height: 2px; background: #eeeeea"><div style="width: 40%; height: 2px; background: #3159c9"></div></div>
      <div style="font-size: 12px; color: #9a9c9e">position 3 of 6</div>
    </div>
  </div>

  <div style="display: flex; gap: 12px; padding: 0 24px 40px 24px">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; background: #17181a; color: #fcfcfa; font-size: 15px; font-weight: 600; border-radius: 24px">Hint</div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid #d5d5d0; color: #55575a; font-size: 15px; font-weight: 500; border-radius: 24px">Show solution</div>
  </div>
</div>
</x-dc>
</body>
</html>
