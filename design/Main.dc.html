<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    a { color: #c53024; } a:hover { color: #9c2118; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f0e6d2; color: #1a170f; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 52px 22px 12px 22px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a170f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
      <div style="font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px">King opposition · T1</div>
    </div>
    <div style="font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: 18px">3/6</div>
  </div>

  <div style="padding: 6px 22px 16px 22px">
    <div style="font-family: 'Anton', 'Arial Narrow', sans-serif; font-size: 44px; line-height: 0.98; text-transform: uppercase">White<br>to win<span style="color: #c53024">.</span></div>
  </div>

  <div style="margin: 0 16px; border: 3px solid #1a170f; box-shadow: 7px 7px 0 #1a170f; background: #1a170f">
    <div style="position: relative; width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#4a4232 0% 25%, #f7efdd 0% 50%); background-size: 25% 25%; overflow: hidden">
      <div style="position: absolute; box-sizing: border-box; left: 50%; top: 12.5%; width: 12.5%; height: 12.5%; border: 3px solid #1a170f; opacity: 0.55"></div>
      <div style="position: absolute; box-sizing: border-box; left: 50%; top: 25%; width: 12.5%; height: 12.5%; border: 3px solid #1a170f"></div>
      <div style="position: absolute; left: 50%; top: 25%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 84%; height: 84%"><path d="M18 2h4v5h5v4h-5v3h-4v-3h-5V7h5z" fill="#c53024" stroke="#1a170f" stroke-width="2" stroke-linejoin="round"></path><path d="M11.5 34C9.5 24 14 17.5 20 15.5c6 2 10.5 8.5 8.5 18.5z" fill="#c53024" stroke="#1a170f" stroke-width="2" stroke-linejoin="round"></path><rect x="8.5" y="33" width="23" height="4.5" rx="1" fill="#c53024" stroke="#1a170f" stroke-width="2"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 84%; height: 84%"><path d="M18 2h4v5h5v4h-5v3h-4v-3h-5V7h5z" fill="#f0e6d2" stroke="#1a170f" stroke-width="2" stroke-linejoin="round"></path><path d="M11.5 34C9.5 24 14 17.5 20 15.5c6 2 10.5 8.5 8.5 18.5z" fill="#f0e6d2" stroke="#1a170f" stroke-width="2" stroke-linejoin="round"></path><rect x="8.5" y="33" width="23" height="4.5" rx="1" fill="#f0e6d2" stroke="#1a170f" stroke-width="2"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 62.5%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 70%; height: 70%"><circle cx="20" cy="11" r="6" fill="#f0e6d2" stroke="#1a170f" stroke-width="2"></circle><path d="M13.5 33c0-8 3.5-12.5 6.5-14.5 3 2 6.5 6.5 6.5 14.5z" fill="#f0e6d2" stroke="#1a170f" stroke-width="2" stroke-linejoin="round"></path><rect x="10.5" y="32.5" width="19" height="4.5" rx="1" fill="#f0e6d2" stroke="#1a170f" stroke-width="2"></rect></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; margin: 24px 22px 0 22px; flex-grow: 1">
    <div style="border: 3px solid #1a170f; background: #f7efdd; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <div style="width: 12px; height: 12px; background: #c53024; flex-shrink: 0; margin-top: 4px"></div>
      <div style="font-size: 15px; line-height: 1.45; font-weight: 500">Use the opposition to escort the pawn. Take the square directly in front of the enemy king.</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="flex-grow: 1; height: 8px; border: 2px solid #1a170f"><div style="width: 40%; height: 100%; background: #1a170f"></div></div>
      <div style="font-size: 12px; font-weight: 800">POSITION 3 OF 6</div>
    </div>
  </div>

  <div style="display: flex; gap: 12px; padding: 0 22px 40px 22px">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; background: #1a170f; color: #f0e6d2; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; box-shadow: 4px 4px 0 #c53024">Hint</div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; border: 3px solid #1a170f; color: #1a170f; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px">Solution</div>
  </div>
</div>
</x-dc>
</body>
</html>
