<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #3159c9; } a:hover { color: #24439c; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #fcfcfa; color: #17181a; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 64px 28px 8px 28px">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.4px">Endgame</div>
    <div style="font-size: 14px; color: #9a9c9e">Sunday 30 August</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 28px; margin-top: 12px; border-top: 1px solid #e6e6e2; border-bottom: 1px solid #e6e6e2">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <div style="font-size: 30px; font-weight: 600; letter-spacing: -0.5px; color: #3159c9">6</div>
      <div style="font-size: 15px; color: #17181a">positions due</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; color: #3159c9; font-size: 15px; font-weight: 600; min-height: 44px">
      Review
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
  </div>

  <div style="font-size: 12px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; color: #9a9c9e; padding: 28px 28px 6px 28px">Tiers</div>

  <div style="display: flex; flex-direction: column; padding: 0 28px; flex-grow: 1; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #e6e6e2">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 16px; font-weight: 500">1 · Foundations</div>
        <div style="font-size: 13px; color: #9a9c9e">4 of 4</div>
      </div>
      <div style="height: 2px; background: #eeeeea"><div style="width: 100%; height: 2px; background: #17181a"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #e6e6e2">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 16px; font-weight: 500">2 · Beginner</div>
        <div style="font-size: 13px; color: #9a9c9e">3 of 5</div>
      </div>
      <div style="height: 2px; background: #eeeeea"><div style="width: 60%; height: 2px; background: #17181a"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #e6e6e2">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 16px; font-weight: 500">3 · Intermediate</div>
        <div style="font-size: 13px; color: #9a9c9e">1 of 5</div>
      </div>
      <div style="height: 2px; background: #eeeeea"><div style="width: 20%; height: 2px; background: #17181a"></div></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #e6e6e2; color: #9a9c9e">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 16px; font-weight: 500">4 · Club</div>
        <div style="font-size: 13px">0 of 5</div>
      </div>
      <div style="height: 2px; background: #eeeeea"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 0; border-bottom: 1px solid #e6e6e2; color: #9a9c9e">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 16px; font-weight: 500">5 · Strong club</div>
        <div style="font-size: 13px">0 of 5</div>
      </div>
      <div style="height: 2px; background: #eeeeea"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 15px 0; color: #9a9c9e">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
        <div style="font-size: 16px; font-weight: 500">6 · 1800 target</div>
        <div style="font-size: 13px">0 of 5</div>
      </div>
      <div style="height: 2px; background: #eeeeea"></div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-around; align-items: center; padding: 14px 12px 30px 12px; border-top: 1px solid #e6e6e2; background: #fcfcfa">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #17181a; min-width: 64px; min-height: 44px; justify-content: center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M12 6.5C10.7 5 8.7 4.2 4.5 4.2v13.6c4.2 0 6.2.8 7.5 2.2 1.3-1.4 3.3-2.2 7.5-2.2V4.2c-4.2 0-6.2.8-7.5 2.3z"></path><path d="M12 6.5V20"></path></svg>
      <div style="font-size: 11px; font-weight: 600">Learn</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9a9c9e; min-width: 64px; min-height: 44px; justify-content: center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><circle cx="12" cy="13" r="7"></circle><path d="M12 9.5V13l2.5 2M9.5 3.5h5"></path></svg>
      <div style="font-size: 11px; font-weight: 500">Review</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9a9c9e; min-width: 64px; min-height: 44px; justify-content: center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 8.5h6M9 12.5h6M9 16.5h4"></path></svg>
      <div style="font-size: 11px; font-weight: 500">Games</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9a9c9e; min-width: 64px; min-height: 44px; justify-content: center">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 4v2.4M12 17.6V20M4 12h2.4M17.6 12H20M6.6 6.6l1.7 1.7M15.7 15.7l1.7 1.7M17.4 6.6L15.7 8.3M8.3 15.7l-1.7 1.7"></path></svg>
      <div style="font-size: 11px; font-weight: 500">Settings</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
