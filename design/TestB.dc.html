<x-dc>
<helmet>

  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #c8f04c; } a:hover { color: #dcff70; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #101416; color: #e8ecec; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 54px 20px 16px 20px">
    <div style="display: flex; align-items: center; gap: 12px">
      <svg viewBox="0 0 24 24" fill="none" stroke="#e8ecec" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 22px; height: 22px"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 1px">
        <div style="font-size: 16px; font-weight: 700">King opposition</div>
        <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #94a1a1">T1 · FOUNDATIONS</div>
      </div>
    </div>
    <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; font-weight: 700; color: #c8f04c">03/06</div>
  </div>

  <div style="display: flex; justify-content: center; padding: 6px 20px 16px 20px">
    <div style="display: flex; align-items: center; gap: 8px; background: #c8f04c; color: #101416; padding: 8px 16px; border-radius: 4px">
      <div style="width: 10px; height: 10px; border-radius: 50%; background: #f6f8f2; border: 1.5px solid #101416"></div>
      <div style="font-size: 13px; font-weight: 800; letter-spacing: 1.2px">WHITE TO WIN</div>
    </div>
  </div>

  <div style="margin: 0 14px; padding: 8px; background: #1a2023; border-radius: 8px; border: 1px solid #232a2e">
    <div style="position: relative; width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#6d8f61 0% 25%, #e2e5c9 0% 50%); background-size: 25% 25%; border-radius: 3px; overflow: hidden">
      <div style="position: absolute; left: 50%; top: 12.5%; width: 12.5%; height: 12.5%; background: rgba(200, 240, 76, 0.30)"></div>
      <div style="position: absolute; left: 50%; top: 25%; width: 12.5%; height: 12.5%; background: rgba(200, 240, 76, 0.48)"></div>
      <div style="position: absolute; left: 50%; top: 25%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 80%; height: 80%"><path d="M18 2h4v5h5v4h-5v3h-4v-3h-5V7h5z" fill="#20262a" stroke="#0a0d0f" stroke-width="1.4" stroke-linejoin="round"></path><path d="M11.5 34C9.5 24 14 17.5 20 15.5c6 2 10.5 8.5 8.5 18.5z" fill="#20262a" stroke="#0a0d0f" stroke-width="1.4" stroke-linejoin="round"></path><rect x="8.5" y="33" width="23" height="4.5" rx="2" fill="#20262a" stroke="#0a0d0f" stroke-width="1.4"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 50%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 80%; height: 80%"><path d="M18 2h4v5h5v4h-5v3h-4v-3h-5V7h5z" fill="#f6f8f2" stroke="#20262a" stroke-width="1.4" stroke-linejoin="round"></path><path d="M11.5 34C9.5 24 14 17.5 20 15.5c6 2 10.5 8.5 8.5 18.5z" fill="#f6f8f2" stroke="#20262a" stroke-width="1.4" stroke-linejoin="round"></path><rect x="8.5" y="33" width="23" height="4.5" rx="2" fill="#f6f8f2" stroke="#20262a" stroke-width="1.4"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 62.5%; width: 12.5%; height: 12.5%; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 40 40" style="width: 66%; height: 66%"><circle cx="20" cy="11" r="6" fill="#f6f8f2" stroke="#20262a" stroke-width="1.4"></circle><path d="M13.5 33c0-8 3.5-12.5 6.5-14.5 3 2 6.5 6.5 6.5 14.5z" fill="#f6f8f2" stroke="#20262a" stroke-width="1.4" stroke-linejoin="round"></path><rect x="10.5" y="32.5" width="19" height="4.5" rx="2" fill="#f6f8f2" stroke="#20262a" stroke-width="1.4"></rect></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; margin: 18px 20px 0 20px; flex-grow: 1">
    <div style="display: flex; gap: 12px; padding: 14px 16px; background: #1a2023; border-radius: 6px; border: 1px solid #232a2e">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c8f04c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px"><path d="M9.5 18h5M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.9.7 1.5 1.7 1.5 2.6h4c0-.9.6-1.9 1.5-2.6A6 6 0 0 0 12 3z"></path></svg>
      <div style="font-size: 14px; line-height: 1.5; color: #c3cccc">Use the opposition to escort the pawn. Kings face off with one square between — the side <span style="font-weight: 700; color: #e8ecec">not</span> to move has it.</div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #94a1a1">ATTEMPT 1 · HINT 1/2 USED</div>
      <div style="display: flex; gap: 5px">
        <div style="width: 22px; height: 5px; background: #c8f04c; border-radius: 1px"></div>
        <div style="width: 22px; height: 5px; background: #c8f04c; border-radius: 1px"></div>
        <div style="width: 22px; height: 5px; background: #2c3438; border-radius: 1px"></div>
        <div style="width: 22px; height: 5px; background: #2c3438; border-radius: 1px"></div>
        <div style="width: 22px; height: 5px; background: #2c3438; border-radius: 1px"></div>
        <div style="width: 22px; height: 5px; background: #2c3438; border-radius: 1px"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 10px; padding: 0 20px 40px 20px">
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; background: #1a2023; border: 1px solid #3d4a50; color: #c8f04c; font-size: 14px; font-weight: 700; border-radius: 5px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px"><path d="M9.5 18h5M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.9.7 1.5 1.7 1.5 2.6h4c0-.9.6-1.9 1.5-2.6A6 6 0 0 0 12 3z"></path></svg>
      Next hint
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; min-height: 50px; background: #1a2023; border: 1px solid #232a2e; color: #94a1a1; font-size: 14px; font-weight: 600; border-radius: 5px">Show solution</div>
  </div>
</div>
</x-dc>

</html>
